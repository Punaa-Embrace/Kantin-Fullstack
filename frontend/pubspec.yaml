name: kantin
description: Aplikasi Mobile Kantin Polibatam.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/store/
    - assets/category/
    - assets/orang.png
    - assets/logo.png
    - assets/icon.png

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.woff
        - asset: fonts/Inter-Bold.woff
          weight: 700